<div class="register-component">
    <mat-card>
        <mat-card-header class="padding-p">
            <mat-card-title>Cadastro de novo usuário</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="form">
                <mat-form-field appearance="outline" class="full-width" id="input-field">
                    <mat-label>Nome completo</mat-label>
                    <input matInput placeholder="Digite Seu Nome completo" formControlName="fullName">
                    @if (fullNameErrors) {
                    <mat-error>
                        {{ fullNameErrors }}
                    </mat-error>
                    }
                </mat-form-field>


                <mat-form-field appearance="outline" class="full-width">

                    <mat-label>Email</mat-label>
                    <input matInput placeholder="Digite Seu email." formControlName="email">
                    @if (emailErrors) {
                    <mat-error>
                      {{ emailErrors }}
                    </mat-error>
                    }
                </mat-form-field>
                <input-password-field [control]="passwordControl"></input-password-field>
            </form>
        </mat-card-content>
        <mat-card-actions>
            <button matButton="elevated" class="full-width" [disabled]="form.invalid"
                (click)="submit()">Cadastrar</button>
        </mat-card-actions>
    </mat-card>
</div>
