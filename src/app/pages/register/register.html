<div class="register-component">
    <mat-card>
        <mat-card-header class="padding-p">
            <mat-card-title>Cadastro de novo usuário</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <mat-form-field appearance="outline" class="full-width" id="input-field">
                <mat-label>Nome completo</mat-label>
                <input matInput placeholder="Digite Seu Nome completo">
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email</mat-label>
                <input matInput placeholder="Digite Seu email.">
            </mat-form-field>
            <input-password-field></input-password-field>
        </mat-card-content>
        <mat-card-actions >
            <button matButton="elevated" class="full-width">Cadastrar</button>
        </mat-card-actions>
    </mat-card>
</div>
